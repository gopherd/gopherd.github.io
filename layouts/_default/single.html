{{ define "main" }}
<article class="legal-page">
  <header class="container legal-header"><a class="back-link" href="{{ "/" | relURL }}"><span aria-hidden="true">←</span> Back to home</a><h1>{{ .Title }}</h1><p class="updated">Last updated: {{ .Params.updated }}</p></header>
  <div class="container legal-layout">
    <aside class="legal-sidebar" aria-label="Page contents and contact">
      <details class="table-of-contents" open><summary id="toc-heading">On this page</summary>{{ replace .TableOfContents "<nav " "<nav aria-labelledby=\"toc-heading\" " | safeHTML }}</details>
      <div class="legal-help"><p>Have a question?</p><a href="mailto:{{ .Site.Params.email }}">Contact us <span aria-hidden="true">↗</span></a></div>
    </aside>
    <div class="prose">{{ .Content }}</div>
  </div>
</article>
{{ end }}
