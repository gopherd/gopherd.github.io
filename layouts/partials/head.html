<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ if .IsHome }}{{ .Site.Title }} — Useful apps for everyday life{{ else }}{{ .Title }} | {{ .Site.Title }}{{ end }}</title>
  <meta name="description" content="{{ .Description | default .Site.Params.description }}">
  <meta name="author" content="{{ .Site.Params.author }}">
  {{ if eq .Kind "404" }}<meta name="robots" content="noindex">{{ else }}<link rel="canonical" href="{{ .Permalink }}">{{ end }}
  <meta name="theme-color" content="#faf9f6">
  <meta property="og:title" content="{{ if .IsHome }}{{ .Site.Title }} — Useful apps for everyday life{{ else }}{{ .Title }} | {{ .Site.Title }}{{ end }}">
  <meta property="og:description" content="{{ .Description | default .Site.Params.description }}">
  <meta property="og:type" content="website">
  <meta property="og:url" content="{{ .Permalink }}">
  <link rel="preload" href="{{ "/fonts/manrope-latin.woff2" | relURL }}" as="font" type="font/woff2" crossorigin>
  {{ if .IsHome }}<link rel="preload" href="{{ "/fonts/instrument-serif-italic-latin.woff2" | relURL }}" as="font" type="font/woff2" crossorigin>{{ end }}
  {{ $style := resources.Get "css/style.css" | minify | fingerprint }}
  <link rel="stylesheet" href="{{ $style.RelPermalink }}" integrity="{{ $style.Data.Integrity }}">
</head>
