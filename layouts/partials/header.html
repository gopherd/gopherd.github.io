<header class="site-header">
  <div class="container header-inner">
    <a class="brand" href="{{ "/" | relURL }}" aria-label="Gopherd home"><span class="brand-mark" aria-hidden="true">g.</span>gopherd<span class="brand-dot">.</span></a>
    <nav aria-label="Main navigation">
      {{ $current := .RelPermalink }}
      {{ range .Site.Menus.main }}<a href="{{ .URL | relURL }}"{{ if eq $current .URL }} aria-current="page"{{ end }}>{{ .Name }}</a>{{ end }}
    </nav>
  </div>
</header>
